plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-kapt'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    namespace 'com.adaptiveTrust.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.adaptiveTrust.mobile"
        minSdk 28           // BiometricPrompt StrongBox requires API 28+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "API_BASE_URL", '"https://adaptrust.internal:8000"'
        buildConfigField "String", "WS_ALERTS_URL", '"wss://adaptrust.internal:8000/api/v1/ws/alerts"'
        buildConfigField "String", "WS_CONSOLE_URL", '"wss://adaptrust.internal:8000/api/v1/ws/console"'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:8000"'
            buildConfigField "String", "WS_ALERTS_URL", '"ws://10.0.2.2:8000/api/v1/ws/alerts"'
            buildConfigField "String", "WS_CONSOLE_URL", '"ws://10.0.2.2:8000/api/v1/ws/console"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // Room schema export directory
    kapt {
        arguments { arg("room.schemaLocation", "$projectDir/schemas") }
    }
}

dependencies {
    // ── Kotlin & Coroutines ────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.23'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // ── AndroidX Core ─────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'

    // ── Lifecycle / MVVM ──────────────────────────────────────────────────────
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'

    // ── Navigation ─────────────────────────────────────────────────────────────
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // ── UI Components ─────────────────────────────────────────────────────────
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // ── Networking (Retrofit2 + OkHttp) ───────────────────────────────────────
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ── WebSocket (OkHttp) ────────────────────────────────────────────────────
    // OkHttp includes WebSocket support – no extra dep needed

    // ── Biometric ─────────────────────────────────────────────────────────────
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // ── DataStore (preferences) ───────────────────────────────────────────────
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // ── Hilt DI ───────────────────────────────────────────────────────────────
    implementation 'com.google.dagger:hilt-android:2.51'
    kapt 'com.google.dagger:hilt-compiler:2.51'

    // ── Room (offline-first cache) ────────────────────────────────────────────
    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // ── WorkManager (background worker) ──────────────────────────────────────
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'


    // ── Charts (MPAndroidChart) ───────────────────────────────────────────────
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ── Testing ───────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
